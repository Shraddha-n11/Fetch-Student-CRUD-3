
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Student CRUD 3</title>
</head>
<body>

<header class="text-center text-white">
    <h2><i class="fa-solid fa-utensils"></i> Food Chart</h2>
</header>

<div class="container mt-4">
    <div class="row">

        <div class="col-md-4">
            <div class="card">
                <div class="card-header text-center">
                    <h4>Food Details</h4>
                </div>

                <div class="card-body">
                    <form id="form">

                        <div class="form-group">
                            <label>Food Name</label>
                            <input type="text" id="FoodName"
                            class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label>Category</label>
                            <select id="Category" class="form-control" required>
                                <option value="">Select Category</option>
                                <option value="Pizza">Pizza</option>
                                <option value="Burger">Burger</option>
                                <option value="Indian">Indian</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Price</label>
                            <input type="number" id="Price"
                            class="form-control" min="1" required>
                        </div>

                        <button class="btn btn-dark btn-block" id="SubmitBtn">
                            Add Food
                        </button>

                        <button type="button" class="btn btn-primary btn-block d-none"
                        id="UpdateBtn">
                            Update Food
                        </button>

                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8 mt-4 mt-md-0">
            <div class="table-responsive">
                <table class="table table-bordered text-center">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Food Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Edit</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody id="foodData"></tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<div class="spinner d-none" id="spinner">
    <div class="spinner-border text-primary"></div>
    <span class="sr-only">Loading...</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="./assets/js/app.js"></script>

</body>
</html>
